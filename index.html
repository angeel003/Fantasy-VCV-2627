<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Liga de Porras Voleibol 25/26</title>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        margin: 0;
    }

    header {
        background: linear-gradient(135deg, #0d47a1, #1976d2);
        color: white;
        padding: 60px 15px;
        text-align: center;
    }

    header h1 {
        font-family: 'Golos Text', sans-serif;
        font-weight: 600;
        font-size: 3.2rem;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    header p {
        font-family: 'Golos Text', sans-serif;
        font-weight: 400;
        font-size: 1.1rem;
        opacity: 0.9;
    }

    section {
        padding: 60px 15px;
        text-align: center;
    }

    .section-alt {
        background: #e9ecef;
    }

    h2 {
        margin-bottom: 35px;
        font-weight: 600;
        color: #333;
    }

    table {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        border-collapse: collapse;
        background: white;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border-radius: 8px;
        overflow: hidden;
    }

    th, td {
        padding: 14px 18px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }

    thead {
        background: #1976d2;
        color: white;
    }

    tbody tr {
        transition: all 0.25s ease-in-out;
    }

    tbody tr:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Medallas Top 3 */
    .medal-1 { background: #fff8e1; font-weight: bold; }
    .medal-2 { background: #f8f9fa; font-weight: bold; }
    .medal-3 { background: #fff4e6; font-weight: bold; }
    .last-places { background: #ffebee; }

    footer {
        background: #343a40;
        color: white;
        padding: 20px 0;
        text-align: center;
    }
</style>
</head>
<body>

<header>
    <div class="header-content">
        <h1 style="margin-bottom: 25px; line-height:1.2;">🏐 Liga de Porras Voleibol</h1>
        <p style="font-size:0.9rem; margin-bottom: 15px; line-height:1.4;">Temporada 25/26</p>
        <p style="font-size:1rem; opacity:0.85; line-height:1.6;">Predice los resultados de los 3 partidos estrella de cada jornada.</p>
    </div>
</header>
    
<section>
    <div id="messages"></div>
    <h2>Clasificación General</h2>
    <div class="table-responsive">
        <table id="globalTable">
            <thead>
                <tr>
                    <th>Posición y Jugador</th>
                    <th>Puntos Totales</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>
    
<section class="section-alt">
    <h2>Resultados por Jornada</h2>
    <div style="margin-bottom:30px;">
        <label for="jornadaSelect" style="font-weight:bold; font-size:1.1rem;">Filtrar por jornada: </label>
        <select id="jornadaSelect" style="padding:8px 12px; font-size:1rem; border-radius: 5px; border: 1px solid #ccc;">
            <option value="">-- Todas las jornadas --</option>
        </select>
    </div>

    <div class="table-responsive">
        <table id="weeklyTable">
            <thead>
                <tr>
                    <th>Jornada</th>
                    <th>Jugador</th>
                    <th>Puntos</th>
                    <th>Aciertos</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>

<footer>
    <p>© Liga de Voleibol 2025-2026</p>   
</footer>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script>
// =========================================================
// REEMPLAZA ESTOS LINKS POR LOS CSV DE TUS NUEVAS HOJAS
// Archivo -> Compartir -> Publicar en la web -> CSV
// =========================================================
const globalCSV = "ENLACE_CSV_CLASIFICACION_GENERAL_AQUI"; 
const weeklyCSV = "ENLACE_CSV_JORNADAS_AQUI";

function showError(msg) {
    $("#messages").html(`
        <div style="padding:10px; margin:10px auto; max-width: 900px; background:#fee; color:#900; border:1px solid #c00; border-radius:6px; text-align:center;">
            ⚠️ ${msg}
        </div>
    `);
}

function loadCSV(url, callback) {
    if(url.includes("ENLACE_CSV")) return; // Previene error inicial si no hay enlaces reales
    $.ajax({
        type: "GET",
        url: url,
        dataType: "text",
        success: function(data) {
            if (data.includes("<html")) {
                showError("No se pudieron cargar los datos desde Google Sheets. Verifica los enlaces publicados.");
            } else {
                callback(data);
            }
        },
        error: function() {
            showError("Error de conexión con Google Sheets.");
        }
    });
}

// Cargar Clasificación General
function populateGlobalTable(data) {
    const lines = data.split("\n").filter(line => line.trim() !== "");
    const tbody = $("#globalTable tbody");
    tbody.empty();
    
    // Ignoramos la línea 0 (cabeceras)
    for(let i = 1; i < lines.length; i++){
        const cols = lines[i].split(",");
        if(cols.length < 2) continue;
        
        const jugador = cols[0].trim();
        const puntos = cols[1].trim();
        
        let clase="", textoClase="";
        if(i == 1){ clase="medal-1"; textoClase="🥇"; }
        else if(i == 2){ clase="medal-2"; textoClase="🥈"; }
        else if(i == 3){ clase="medal-3"; textoClase="🥉"; }
        else if(i >= lines.length - 2){ clase="last-places"; textoClase="📉"; }
        
        tbody.append(`<tr class="${clase}">
            <td><strong>${i}</strong> - ${jugador} ${textoClase}</td>
            <td style="font-size: 1.1rem; font-weight: bold;">${puntos}</td>
        </tr>`);
    }
}

let weeklyData = []; 

// Cargar Datos por Jornada
function populateWeeklyTable(data) {
    const lines = data.split("\n").filter(line => line.trim() !== "");
    weeklyData = []; 
    let jornadasSet = new Set(); 

    for(let i = 1; i < lines.length; i++){
        const cols = lines[i].split(",");
        if(cols.length < 3) continue; // Necesita al menos Jornada, Jugador, Puntos
        
        const jornada = cols[0].trim();
        const jugador = cols[1].trim();
        const puntos = cols[2].trim();
        const aciertos = cols[3] ? cols[3].trim() : "-"; // Columna 4 opcional (Aciertos)
        
        weeklyData.push({jornada, jugador, puntos, aciertos});
        jornadasSet.add(jornada);
    }

    // Configurar Selector de Jornadas
    const select = $("#jornadaSelect");
    select.find("option:gt(0)").remove(); 

    const jornadasArray = Array.from(jornadasSet).sort((a,b)=> parseInt(a) - parseInt(b));
    jornadasArray.forEach(j => {
        select.append(`<option value="${j}">Jornada ${j}</option>`);
    });

    if(jornadasArray.length > 0) {
        const ultimaJornada = jornadasArray[jornadasArray.length - 1];
        select.val(ultimaJornada);
        renderWeeklyTable(ultimaJornada);
    }
}

// Renderizar Tabla de Jornadas
function renderWeeklyTable(selectedJornada = "") {
    const tbody = $("#weeklyTable tbody");
    tbody.empty();

    let rowsToRender = weeklyData;

    if (selectedJornada !== "") {
        rowsToRender = weeklyData.filter(row => row.jornada === selectedJornada);
        // Ordenar por puntos en esa jornada específica
        rowsToRender.sort((a, b) => parseFloat(b.puntos) - parseFloat(a.puntos));
    } else {
        // Todas las jornadas
        rowsToRender = [...weeklyData].sort((a, b) => parseInt(b.jornada) - parseInt(a.jornada));
    }

    rowsToRender.forEach(row => {
        tbody.append(`<tr>
            <td><strong>${row.jornada}</strong></td>
            <td>${row.jugador}</td>
            <td style="font-weight: bold; color: #1976d2;">${row.puntos}</td>
            <td>${row.aciertos}</td>
        </tr>`);
    });
}

$("#jornadaSelect").on("change", function(){
    renderWeeklyTable($(this).val());
});

$(document).ready(function(){
    loadCSV(globalCSV, populateGlobalTable);
    loadCSV(weeklyCSV, populateWeeklyTable);
});
</script>
</body>
</html>
