<form id="porraForm">
    <!-- Datos de usuario -->
    <div class="row">
        <div class="form-group col-md-4">
            <label>Jugador</label>
            <input type="text" id="inputUsuario" class="form-control" required>
        </div>
        <div class="form-group col-md-4">
            <label>Contraseña</label>
            <input type="password" id="inputPassword" class="form-control" required>
        </div>
        <div class="form-group col-md-4">
            <label>Jornada</label>
            <input type="number" id="inputJornada" class="form-control" required min="1">
        </div>
    </div>
    
    <hr>
    <h4 style="color: #0d47a1; margin-bottom: 20px;">Predicciones de la Jornada</h4>

    <!-- Generamos 5 bloques, uno por equipo. Aquí te pongo 2 de ejemplo, copia y pega hasta tener los 5 cambiando los IDs (e3, e4, e5) -->
    
    <!-- EQUIPO 1 -->
    <div class="p-3 mb-3" style="background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;">
        <h5 style="margin-bottom: 15px;">Equipo 1 (Nombre del equipo)</h5>
        <div class="row">
            <div class="form-group col-md-6">
                <label>Resultado (Sets)</label>
                <select class="form-control" id="e1_sets" required>
                    <option value="">Elige resultado...</option>
                    <option value="2-0">Victoria 2-0</option>
                    <option value="2-1">Victoria 2-1</option>
                    <option value="1-2">Derrota 1-2</option>
                    <option value="0-2">Derrota 0-2</option>
                </select>
            </div>
            <div class="form-group col-md-6">
                <label>Diferencia de puntos</label>
                <input type="number" class="form-control" id="e1_puntos" placeholder="Ej: 12" required>
            </div>
        </div>
    </div>

    <!-- EQUIPO 2 -->
    <div class="p-3 mb-3" style="background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;">
        <h5 style="margin-bottom: 15px;">Equipo 2 (Nombre del equipo)</h5>
        <div class="row">
            <div class="form-group col-md-6">
                <label>Resultado (Sets)</label>
                <select class="form-control" id="e2_sets" required>
                    <option value="">Elige resultado...</option>
                    <option value="2-0">Victoria 2-0</option>
                    <option value="2-1">Victoria 2-1</option>
                    <option value="1-2">Derrota 1-2</option>
                    <option value="0-2">Derrota 0-2</option>
                </select>
            </div>
            <div class="form-group col-md-6">
                <label>Diferencia de puntos</label>
                <input type="number" class="form-control" id="e2_puntos" placeholder="Ej: -5" required>
            </div>
        </div>
    </div>
    
    <!-- REPETIR PARA EQUIPOS 3, 4 y 5 (Cambiando IDs a e3_sets, e3_puntos, etc.) -->

    <button type="submit" class="btn btn-primary btn-block mt-4" id="btnSubmit" style="font-weight: bold; font-size: 1.1rem; padding: 12px;">Enviar Predicciones</button>
</form>
